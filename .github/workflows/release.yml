# Entrypoint workflow for releasing the ThunderID Skills plugin bundle.
# The bundle itself is versioned as a single unit via the plugin manifests.
# Individual skills carry their own version too, bumped by the same amount,
# but only when that skill's SKILL.md changed since the previous release tag.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

  release:
    name: 🚀 Release thunderid-skills
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          fetch-depth: 0

      - name: 🏷️ Bump Version
        id: bump
        run: |
          bump_semver() {
            IFS='.' read -r major minor patch <<< "$1"
            case "${{ github.event.inputs.bump_type }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            echo "$major.$minor.$patch"
          }

          current="$(jq -r '.version' .codex-plugin/plugin.json)"
          version="$(bump_semver "$current")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          jq --arg v "$version" '.version = $v' .codex-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .codex-plugin/plugin.json

          jq --arg v "$version" '.metadata.version = $v' .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json

      - name: 🏷️ Bump Changed Skill Versions
        id: bump_skills
        run: |
          bump_semver() {
            IFS='.' read -r major minor patch <<< "$1"
            case "${{ github.event.inputs.bump_type }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            echo "$major.$minor.$patch"
          }

          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -n "$prev_tag" ]; then
            changed_files="$(git diff --name-only "$prev_tag" -- 'skills/*/SKILL.md')"
          else
            changed_files="$(git ls-files 'skills/*/SKILL.md')"
          fi

          bumped=""
          for file in $changed_files; do
            [ -f "$file" ] || continue

            # Skip if the only diff vs the previous tag is the version line itself.
            if [ -n "$prev_tag" ]; then
              if ! git diff "$prev_tag" -- "$file" | grep -qvE '^(diff|index|---|\+\+\+|@@|[-+]  version: )'; then
                continue
              fi
            fi

            current_version="$(sed -n 's/^  version: //p' "$file" | head -1)"
            [ -n "$current_version" ] || continue

            new_version="$(bump_semver "$current_version")"
            sed -i "0,/^  version: /s/^  version: .*/  version: $new_version/" "$file"

            skill_name="$(basename "$(dirname "$file")")"
            bumped="$bumped $skill_name@$new_version"
          done

          echo "bumped=${bumped# }" >> "$GITHUB_OUTPUT"

      - name: 📤 Commit, Tag & Push
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add .codex-plugin/plugin.json .claude-plugin/marketplace.json skills/*/SKILL.md
          if [ -n "${{ steps.bump_skills.outputs.bumped }}" ]; then
            echo "Bumped skill versions: ${{ steps.bump_skills.outputs.bumped }}"
          fi
          git commit -m "[Release] thunderid-skills v${{ steps.bump.outputs.version }}"
          for i in $(seq 1 5); do
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$i" -eq 5 ] && exit 1
            sleep $((i * 3))
          done
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "ThunderID Skills v${{ steps.bump.outputs.version }}" \
            --generate-notes
